name: JKLar
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "26.0"
  createIntermediateGroups: true
# Local.xcconfig (git-ignorado) fornece DEVELOPMENT_TEAM/GOOGLE_CLIENT_ID/etc como valores reais de
# desenvolvimento local — nunca versionados. Sem isso, cada `xcodegen generate` reseta essas chaves
# pro texto literal "$(DEVELOPMENT_TEAM)" (a env var só existe se exportada manualmente na sessão de
# shell, o que não sobrevive entre invocações). Ver client/Local.xcconfig.example para o template.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    PRODUCT_BUNDLE_IDENTIFIER: com.jklar.app
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Pacote SPM local — contrato de DTOs compartilhado com o backend (plano 01-01, ver
  # Shared/Package.swift). O cliente importa `JKLarShared` para falar exatamente a mesma
  # forma de request/response que `AuthController`/`HouseholdController` esperam, sem
  # duplicar `SessionRequest`/`SessionResponse`/`HouseholdDTO` como structs locais.
  JKLarShared:
    path: ../Shared
  # Login com Google (plano 01-08). Tag 9.2.0 verificada em
  # github.com/google/GoogleSignIn-iOS/releases em 2026-08-16 — pinar ≥7.1.0 não é
  # preferência: versões anteriores não trazem Privacy Manifest e são rejeitadas na
  # submissão desde maio de 2024 (01-RESEARCH.md, Package Legitimacy Audit: OK/Approved,
  # org oficial google).
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.2.0"
  # Login com Microsoft (plano 01-08). Tag 2.14.1 verificada em
  # github.com/AzureAD/microsoft-authentication-library-for-objc/releases em 2026-08-16
  # (01-RESEARCH.md, Package Legitimacy Audit: OK/Approved, org oficial AzureAD).
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: "2.14.1"
targets:
  JKLar:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: JKLar
    dependencies:
      - package: JKLarShared
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: MSAL
    info:
      path: JKLar/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Plano 01-12 (D-15): sem este background mode o SO nunca entrega push remoto ao
        # app, mesmo com o entitlement aps-environment configurado — as duas coisas são
        # exigidas juntas, uma no Info.plist e outra no entitlements, nas duas plataformas.
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.jklar.app
            CFBundleURLSchemes:
              - jklar
          # Esquema de retorno do fluxo de browser do GIDSignIn — o "reversed client ID"
          # que o Google gera junto do OAuth client ID (visível na mesma tela do console
          # que mostra o GOOGLE_CLIENT_ID). Não é uma transformação textual simples do
          # client ID (não é literalmente a string invertida) — por isso é uma segunda
          # variável de ambiente, não derivada de GOOGLE_CLIENT_ID em build time.
          - CFBundleURLName: com.jklar.app.google
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          # Esquema de retorno do fluxo MSAL (D-01/D-03 da task): sempre
          # msauth.<bundle-id> para o formato de redirect URI que a Microsoft espera.
          - CFBundleURLName: com.jklar.app.msal
            CFBundleURLSchemes:
              - msauth.com.jklar.app
        # MSAL precisa poder checar se os apps oficiais da Microsoft (Authenticator/Company
        # Portal) estão instalados para oferecer broker SSO — sem isto no
        # LSApplicationQueriesSchemes, canOpenURL sempre devolve false silenciosamente.
        LSApplicationQueriesSchemes:
          - msauthv2
          - msauthv3
        # Lido pelo GIDSignIn na inicialização quando nenhuma GIDConfiguration explícita é
        # passada — mesmo padrão de $(DEVELOPMENT_TEAM) já usado neste arquivo (01-03):
        # substituído pelo XcodeGen a partir da variável de ambiente no momento do
        # `xcodegen generate`, nunca versionado como valor literal.
        GIDClientID: "$(GOOGLE_CLIENT_ID)"
        # MSAL não lê o client ID do Info.plist sozinho (diferente do GIDSignIn) —
        # `MicrosoftSignInService` lê esta chave explicitamente para montar o
        # `MSALPublicClientApplicationConfig` em runtime.
        MicrosoftClientID: "$(MICROSOFT_CLIENT_ID)"
        # Único outro conhecimento do cliente sobre o backend além do 127.0.0.1 de DEBUG em
        # APIConfiguration.swift (regra zero-trust do CLAUDE.md) — placeholder até a Fase 10
        # decidir o hosting real (Fly.io/Railway, STACK.md); não é lido em builds DEBUG.
        JKLarAPIBaseURL: "https://api.jklar.app"
    entitlements:
      path: JKLar/JKLar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.applesignin:
          - Default
        # Plano 01-12 (D-15/D-16): registro remoto (`registerForRemoteNotifications()`)
        # exige este entitlement nas duas plataformas — sem ele o SO nunca chega a chamar
        # `didRegisterForRemoteNotificationsWithDeviceToken`. `development` cobre os builds
        # de Debug locais desta fatia; a variante `production` (TestFlight/App Store) fica
        # para a Fase 10 (hosting real, mesmo adiamento já documentado em
        # `JKLarAPIBaseURL`/APIConfiguration.swift). O ambiente enviado ao backend em cada
        # registro (`APNSEnvironment` em `DeviceRegistrationRequest`) é decidido em código
        # por `#if DEBUG` (D-16 opção c), independente deste valor de assinatura.
        aps-environment: development
        # O cache de tokens do MSAL precisa de um keychain-access-group explícito — sem
        # isto o fluxo compila mas falha só em tempo de execução no macOS (plano 01-08).
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jklar.app
    scheme:
      testTargets:
        - JKLarTests
  JKLarTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: JKLarTests
    dependencies:
      - target: JKLar
      - package: JKLarShared
    settings:
      base:
        # XcodeGen infere TEST_HOST/BUNDLE_LOADER automaticamente a partir da dependência
        # no target de app, mas usa o layout de bundle do iOS (executável direto dentro de
        # `JKLar.app`). No macOS o executável fica em `JKLar.app/Contents/MacOS/JKLar` — sem
        # este override condicional por SDK o teste hosted falha ao localizar o TEST_HOST no
        # build de macOS ("Could not find test host for JKLarTests").
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/JKLar.app/Contents/MacOS/JKLar"
